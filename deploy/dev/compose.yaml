version: "3.9"
services:
  llm-guard:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: llm-guard:dev
    ports:
      - "8080:8080"
    environment:
      LLM_GUARD_PORT: "8080"
      LLM_GUARD_PII_TYPES_PATH: "/etc/llm-guard/pii-types.json"
      LLM_GUARD_INBOUND_SCANNERS: "prompt_injection,secrets,ban_substrings,toxicity,ban_topics"
      LLM_GUARD_OUTBOUND_SCANNERS: "secrets,prompt_injection,malicious_urls,sensitive"
      LLM_GUARD_BAN_TOPICS: "violence,illegal_activity"
    volumes:
      - ../../tests/fixtures/pii-types.json:/etc/llm-guard/pii-types.json:ro
