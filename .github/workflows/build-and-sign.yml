name: build-and-sign
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llm-guard:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/llm-guard:${{ steps.ver.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/llm-guard:latest
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/llm-guard@${DIGEST}
      - name: sbom (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/llm-guard@${{ steps.push.outputs.digest }}
          format: spdx-json

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      # docker/login-action writes ~/.docker/config.json — helm 3.7+ uses it
      # as OCI fallback creds AND cosign reads it for signature push.
      # Replaces the `echo $TOKEN | helm registry login --password-stdin`
      # pattern that 403s on the bearer-token endpoint.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: package chart
        run: |
          helm package deploy/helm/ --app-version ${GITHUB_REF_NAME#v} --version ${GITHUB_REF_NAME#v}
      - name: push
        id: push_chart
        run: |
          OUTPUT=$(helm push llm-guard-${GITHUB_REF_NAME#v}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
          DIGEST=$(echo "$OUTPUT" | grep -oE 'sha256:[a-f0-9]+' | head -n1)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
      - name: cosign sign chart
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/charts/llm-guard@${{ steps.push_chart.outputs.digest }}
